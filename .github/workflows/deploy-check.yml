name: Deploy check

# After CI passes on main, Railway deploys web and worker (D22). This waits until the live site reports that
# commit on both, then checks it without signing in (apps/web/scripts/check-deploy.ts, D34). A failed run emails
# whoever pushed. Triggered by CI rather than Railway's deployment_status events: those are sent by railway-app[bot],
# so a failed run would notify nobody, and a deploy that never happens sends no event at all (here it times out).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Origin to check
        default: https://lifestory.devopsdirective.com
      sha:
        description: Commit the site should run (default the branch head)
      wait-minutes:
        description: Minutes to wait for the deploy
        default: "0"

concurrency:
  group: deploy-check-${{ github.event.workflow_run.head_sha || github.run_id }}

jobs:
  check:
    name: Live site runs the pushed commit
    # A cancelled CI run (superseded by a newer push) doesn't deploy; Railway waits for passing checks.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          # The script reads the migration journal at this commit and asks git whether a newer commit is live.
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
      - run: cp .env.example .env
      - run: >-
          mise run deploy:check --
          --url "${{ inputs.url || 'https://lifestory.devopsdirective.com' }}"
          --sha "${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          --wait-minutes "${{ inputs.wait-minutes || '25' }}"
