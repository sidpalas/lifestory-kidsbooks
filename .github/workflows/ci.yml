name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tool versions and commands come from mise.toml, the same as in orbs and locally.
jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
      - run: mise run install
      - run: mise run check

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
      - run: cp .env.example .env
      - run: mise run install
      - run: mise run infra:up
      - run: mise run db:migrate
      - run: mise run db:seed
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
